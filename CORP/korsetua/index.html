<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конфігуратор Корсетів (.GLB)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle, #ffffff 40%, #e6e6e6 100%);
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #000;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 30px;
            border: 1px solid #000;
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        #controls-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            z-index: 10;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid #d1d1d1;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #000;
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; /* Обнуляємо стандартні відступи браузера */
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Забезпечуємо ідеальне вирівнювання самої іконки */
        .nav-btn svg {
            display: block;
            margin: auto;
        }

        .nav-btn:hover {
            background: #000;
            color: #fff;
            transform: scale(1.05);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        #patternIndicator {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 180px;
            text-align: center;
            color: #000;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="canvas-container">
        <div id="loader">ЗАВАНТАЖЕННЯ...</div>
        
        <div id="controls-container">
            <!-- Використовуємо SVG замість текстових символів -->
            <button id="prevBtn" class="nav-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            
            <span id="patternIndicator">ЗАВАНТАЖЕННЯ...</span>
            
            <button id="nextBtn" class="nav-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const loaderElement = document.getElementById('loader');
        const patternsData = [
            { name: "Оранджеві котики", path: "patterns/5384469713406072972.jpg" },
            { name: "Темні котики", path: "patterns/5384469713406072973.jpg" },
            { name: "Метелики", path: "patterns/5384469713406072974.jpg" },
            { name: "Абстрактна заливка", path: "patterns/5384469713406072976.jpg" },
            { name: "Веселий губка боб", path: "patterns/5384469713406072977.jpg" },
            { name: "Веселий губка боб", path: "patterns/5384469713406072978.jpg" },
            { name: "Абстрактна заливка", path: "patterns/5384469713406072998.jpg" }
        ];


        let currentIndex = 0;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);
        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight2.position.set(-5, 5, -7);
        scene.add(dirLight2);

        const textureLoader = new THREE.TextureLoader();
        
        function setupTexture(texture, scale = 2) {
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(scale, scale);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return texture;
        }

        const loadedTextures = patternsData.map(item => {
            return textureLoader.load(item.path, (tex) => setupTexture(tex));
        });

        const customMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.4,
            metalness: 0.1,
            map: loadedTextures[0],
            side: THREE.DoubleSide
        });

        customMaterial.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader.replace(
                '#include <common>',
                `#include <common>\n varying vec3 vObjPos;\n varying vec3 vObjNormal;`
            ).replace(
                '#include <begin_vertex>',
                `#include <begin_vertex>\n vObjPos = position;\n vObjNormal = normal;`
            );

            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <common>',
                `#include <common>\n varying vec3 vObjPos;\n varying vec3 vObjNormal;`
            ).replace(
                '#include <map_fragment>',
                `
                #include <map_fragment>
                
                vec3 dirFromCenter = normalize(vec3(vObjPos.x, 0.0, vObjPos.z));
                if (dot(normalize(vObjNormal), dirFromCenter) < 0.0) {
                    diffuseColor = vec4(0.85, 0.85, 0.85, 1.0); 
                }
                `
            );
        };

        function applyCylindricalUVs(geometry) {
            geometry.computeBoundingBox();
            const bbox = geometry.boundingBox;
            
            const pos = geometry.attributes.position;
            const uvs = new Float32Array(pos.count * 2);

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const z = pos.getZ(i);

                const v = (y - bbox.min.y) / (bbox.max.y - bbox.min.y);
                let u = (Math.atan2(x, z) / (2 * Math.PI)) + 0.5;

                uvs[i * 2] = u;
                uvs[i * 2 + 1] = v;
            }

            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            geometry.attributes.uv.needsUpdate = true;
        }

        new THREE.GLTFLoader().load('models/korset_without_tape.glb', function (gltf) {
            const loadedModel = gltf.scene;
            
            loadedModel.traverse((child) => {
                if (child.isMesh) {
                    applyCylindricalUVs(child.geometry); 
                    child.material = customMaterial;
                }
            });

            const box = new THREE.Box3().setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            loadedModel.position.sub(center); 
            camera.position.z = Math.max(size.x, size.y, size.z) * 1.5;
            
            scene.add(loadedModel);
            loaderElement.style.display = 'none';
        }, 
        undefined, 
        function (error) {
            console.error(error);
            loaderElement.innerText = 'ПОМИЛКА ЗАВАНТАЖЕННЯ';
            loaderElement.style.color = 'red';
        });

        const indicator = document.getElementById('patternIndicator');
        indicator.innerText = `${patternsData[0].name} (1 / ${patternsData.length})`;

        function updatePattern(index) {
            if (index < 0) {
                currentIndex = patternsData.length - 1;
            } else if (index >= patternsData.length) {
                currentIndex = 0;
            } else {
                currentIndex = index;
            }

            customMaterial.map = loadedTextures[currentIndex];
            customMaterial.needsUpdate = true;
            
            indicator.innerText = `${patternsData[currentIndex].name} (${currentIndex + 1} / ${patternsData.length})`;
        }

        document.getElementById('prevBtn').addEventListener('click', () => updatePattern(currentIndex - 1));
        document.getElementById('nextBtn').addEventListener('click', () => updatePattern(currentIndex + 1));

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
